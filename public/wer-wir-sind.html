<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer wir sind – AKKI</title>
<meta name="description" content="Der AKKI ist der Arbeitskreis Künstliche Intelligenz der AG Digitalisierung der DGOU, gegründet im Januar 2021.">
<!-- Vorerst fuer Suchmaschinen gesperrt, bis die DGOU die Seite freigibt (siehe inhalte.md) -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo/logo-hell.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="seitenkopf" class="kopf-fix">
  <div class="prototyp-hinweis" role="note">Prototyp – nur Testdaten. Kein Ersatz für ärztliche Beurteilung.</div>
</div>

<header class="seitenkopf">
  <div class="container">
    <h1>Wer wir sind</h1>
    <p id="untertitel">Wir sind der Arbeitskreis KI der AG Digitalisierung der DGOU – für selbstlernende Systeme in Patientenversorgung und Forschung.</p>
  </div>
</header>

<main>
  <section aria-labelledby="zeit-titel">
    <div class="container">
      <h2 id="zeit-titel">Meilensteine</h2>
      <ol class="zeitleiste" id="zeitleiste"></ol>
    </div>
  </section>

  <section class="abschnitt--hell" aria-labelledby="leitung-titel">
    <div class="container">
      <h2 id="leitung-titel">Team</h2>
      <div id="leitung"></div>
      <p class="hinweis stand-zeile" id="leitung-stand"></p>
      <p class="hinweis stand-zeile" id="ag-leitung-stand"></p>
    </div>
  </section>

  <section aria-labelledby="ziele-titel">
    <div class="container">
      <h2 id="ziele-titel">Unsere Ziele</h2>
      <div class="kacheln kacheln--vier" id="ziele"></div>
    </div>
  </section>

  <section class="abschnitt--hell" aria-labelledby="org-titel">
    <div class="container">
      <h2 id="org-titel">Einordnung in der DGOU</h2>
      <div id="organigramm" class="org"></div>
    </div>
  </section>

  <section aria-labelledby="rahmen-titel">
    <div class="container">
      <h2 id="rahmen-titel">Satzung</h2>
      <p class="prosa" id="rahmen-text"></p>
      <p><a class="knopf knopf--sekundaer" id="satzung-link" hidden target="_blank" rel="noopener"></a></p>
    </div>
  </section>
</main>
<div id="seitenfuss"></div>

<script src="layout.js"></script>
<script src="kontakt.js"></script>
<script src="personen.js"></script>
<script src="zeitleiste.js"></script>
<script>
  // Alle Inhalte kommen aus public/daten/organisation.json und personen.json.
  // Texte werden nur als reiner Text eingefügt. Leere Felder werden nicht angezeigt.
  function el(tag, klasse, text) {
    const e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (text != null) e.textContent = text;
    return e;
  }
  const holen = datei => fetch(datei).then(r => { if (!r.ok) throw new Error(datei); return r.json(); });

  // Kachel "Unsere Ziele": Icon, Titel, ein Satz (alles aus organisation.json, nur als Text eingefügt)
  const ZIEL_ICONS = {
    buch: 'M3 5h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H21z',
    netz: 'M6 7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM18 7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM12 21.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM8.5 5h7M7.3 9.2l3.5 7.1M16.7 9.2l-3.5 7.1',
    lupe: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4M8.5 11.5l1.8 1.8 3.2-3.6',
    schild: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4',
  };
  function zielKachel(z) {
    const k = el('article', 'kachel ziel-kachel');
    const icon = el('span', 'ziel-kachel__icon');
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    const pfad = document.createElementNS(NS, 'path');
    pfad.setAttribute('d', ZIEL_ICONS[z.icon] || ZIEL_ICONS.buch);
    svg.appendChild(pfad); icon.appendChild(svg);
    k.append(icon, el('h3', null, z.titel), el('p', null, z.text));
    return k;
  }
  const personenVon = (ids, personen) => (ids || []).map(id => personen[id]).filter(Boolean);

  function box(klasse, name, zusatz, link, schild) {
    const b = el('div', 'org-box ' + klasse);
    // Titelzeile: Name (ggf. als Link) und optional ein kleines Schild wie "Sie sind hier"
    const kopf = schild ? el('span', 'org-box__kopf') : b;
    if (link) {
      const a = el('a', null, name);
      a.href = link; a.target = '_blank'; a.rel = 'noopener';
      kopf.appendChild(el('strong')).appendChild(a);
    } else {
      kopf.appendChild(el('strong', null, name));
    }
    if (schild) { kopf.appendChild(el('span', 'org-box__schild', schild)); b.appendChild(kopf); }
    if (zusatz) b.appendChild(el('span', 'org-box__zusatz', zusatz));
    return b;
  }

  function organigramm(o, personen) {
    const ziel = document.getElementById('organigramm');
    ziel.appendChild(box('', o.name, o.zusatz, o.link));
    ziel.appendChild(el('div', 'org-linie'));
    ziel.appendChild(box('', o.kind.name, null, o.kind.link));
    ziel.appendChild(el('div', 'org-linie'));
    const reihe = el('div', 'org-reihe');
    o.kind.kinder.forEach(k => {
      const kind = el('div', 'org-kind');
      const b = box(k.hervorgehoben ? 'org-box--akki' : '', k.name, k.zusatz, null, k.schild);
      if (k.schwerpunkte) b.appendChild(el('span', 'org-box__zusatz', 'Schwerpunkte: ' + k.schwerpunkte));
      // Im Organigramm nur Namen als Text (keine Fotos)
      const leitung = personenVon(k.leitung, personen).map(p => p.name);
      if (leitung.length) b.appendChild(el('span', 'org-box__zusatz', 'Leitung: ' + leitung.join(', ')));
      const ansprech = personenVon(k.ansprechpersonen, personen).map(p => p.name);
      if (ansprech.length) b.appendChild(el('span', 'org-box__zusatz', 'Ansprechpersonen: ' + ansprech.join(', ')));
      kind.appendChild(b);
      reihe.appendChild(kind);
    });
    ziel.appendChild(reihe);
  }

  Promise.all([holen('daten/organisation.json'), holen('daten/personen.json')]).then(([org, pd]) => {
    const personen = Object.fromEntries(pd.personen.map(p => [p.id, p]));
    const setze = (id, text) => { const e = document.getElementById(id); if (e && text) e.textContent = text; };

    setze('untertitel', org.untertitel);
    document.getElementById('ziele').replaceChildren(...((org.ziele && org.ziele.kacheln) || []).map(zielKachel));

    document.getElementById('zeitleiste').replaceChildren(...(org.zeitleiste || []).map(z => {
      const li = el('li', 'zeitleiste__punkt');
      li.appendChild(el('strong', 'zeitleiste__datum', z.datum));
      li.appendChild(el('span', null, z.text));
      return li;
    }));
    window.zeitleisteAnimieren(document.getElementById('zeitleiste'));

    // Team: der einzige Ort mit Fotos. Jede Person nur einmal (Leitung des AKKI, dann Leitung der AG), Funktionen und Ort aus personen.json
    const ag = pd.agLeitung;
    const teamIds = [...new Set([...(org.leitungPersonen || []), ...((ag && ag.mitglieder) || []).map(m => m.person)])];
    document.getElementById('leitung').replaceChildren(window.personenReihe(personenVon(teamIds, personen).map(p => (
      { person: p, funktionen: [...(p.rollen || []), p.ort] }))));
    setze('leitung-stand', org.leitungHinweis);

    // Stand und Quelle der AG-Leitung
    if (ag) {
      const stand = document.getElementById('ag-leitung-stand');
      stand.textContent = `Stand: ${ag.stand} · ${ag.hinweis} · Quelle: `;
      const a = el('a', null, 'Fachartikel „Neue Führung – next Level Digitalisierung und KI“, Orthopädie und Unfallchirurgie 5/2026');
      a.href = 'https://doi.org/10.1007/s41785-026-4929-z'; a.target = '_blank'; a.rel = 'noopener';
      stand.appendChild(a);
    }

    if (org.organigramm) organigramm(org.organigramm, personen);

    if (org.rahmen) {
      setze('rahmen-text', org.rahmen.text);
      const l = document.getElementById('satzung-link');
      if (org.rahmen.satzungLink) { l.href = org.rahmen.satzungLink; l.textContent = org.rahmen.satzungLinkText || 'Satzung ansehen'; l.hidden = false; }
    }
  }).catch(() => {
    document.querySelector('main').appendChild(el('p', 'hinweis container', 'Die Inhalte konnten gerade nicht geladen werden.'));
  });
</script>
</body>
</html>
